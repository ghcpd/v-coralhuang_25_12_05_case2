name: CI

on:
  push:
    branches: [ main, oswe-mini-secondary ]
  pull_request:
    branches: [ main, oswe-mini-secondary ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install backend deps
      working-directory: ./backend
      run: npm ci
    - name: Run migrate
      working-directory: ./backend
      run: npm run migrate
    - name: Run tests
      working-directory: ./backend
      run: npm test
