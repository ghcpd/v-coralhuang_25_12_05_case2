version: '3.8'
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tour_booking
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - 4000:4000
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tour_booking
    depends_on:
      - db
volumes:
  db-data:
