version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - '3000:80'
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ttb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
